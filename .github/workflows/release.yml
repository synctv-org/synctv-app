name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.8"
  RUST_VERSION: "1.97.1"
  SYNCTV_BUILT_IN_SERVER_URL: ${{ vars.SYNCTV_BUILT_IN_SERVER_URL }}
  SYNCTV_PASSKEY_RP_IDS: ${{ vars.SYNCTV_PASSKEY_RP_IDS }}

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  metadata:
    name: Validate release metadata
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-number: ${{ steps.version.outputs.build-number }}
      artifact-version: ${{ steps.version.outputs.artifact-version }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read and validate pubspec version
        id: version
        shell: bash
        run: |
          raw_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          raw_version="${raw_version%$'\r'}"
          if [[ ! "$raw_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)*$ ]]; then
            echo "Invalid pubspec version: $raw_version" >&2
            exit 1
          fi

          version="${raw_version%%+*}"
          if [[ "$raw_version" == *+* ]]; then
            build_number="${raw_version##*+}"
          else
            build_number="1"
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag $GITHUB_REF_NAME must match pubspec version $version" >&2
              exit 1
            fi
          fi

          {
            echo "version=$version"
            echo "build-number=$build_number"
            echo "artifact-version=$version+$build_number"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android APKs
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Configure Android release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SYNCTV_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SYNCTV_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SYNCTV_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SYNCTV_ANDROID_KEY_PASSWORD }}
        run: |
          values=("$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD")
          configured=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done
          if [[ "$configured" -eq 0 ]]; then
            echo "SYNCTV_ANDROID_SIGNING_LABEL=development" >> "$GITHUB_ENV"
            echo "mode=development" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$configured" -ne "${#values[@]}" ]]; then
            echo "Android release signing secrets are incomplete" >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/synctv-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "SYNCTV_ANDROID_KEYSTORE_PATH=$keystore"
            echo "SYNCTV_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SYNCTV_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "SYNCTV_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "SYNCTV_ANDROID_SIGNING_LABEL=signed"
          } >> "$GITHUB_ENV"
          keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          certificate="$RUNNER_TEMP/synctv-release.cer"
          keytool -exportcert \
            -keystore "$keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file "$certificate"
          certificate_sha256="$(
            openssl x509 -inform DER -in "$certificate" -noout -fingerprint -sha256 \
              | sed 's/^[^=]*=//'
          )"
          if [[ ! "$certificate_sha256" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]; then
            echo "Failed to extract the Android release certificate SHA-256 fingerprint" >&2
            exit 1
          fi
          echo "SYNCTV_ANDROID_CERTIFICATE_SHA256=$certificate_sha256" >> "$GITHUB_ENV"
          echo "mode=signed" >> "$GITHUB_OUTPUT"

      - name: Build split release APKs
        run: |
          flutter build apk \
            --release \
            --dart-define "SYNCTV_BUILT_IN_SERVER_URL=$SYNCTV_BUILT_IN_SERVER_URL" \
            --dart-define "SYNCTV_PASSKEY_RP_IDS=$SYNCTV_PASSKEY_RP_IDS" \
            --build-name "${{ needs.metadata.outputs.version }}" \
            --build-number "${{ needs.metadata.outputs.build-number }}" \
            --split-debug-info build/symbols/android-all
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define "SYNCTV_BUILT_IN_SERVER_URL=$SYNCTV_BUILT_IN_SERVER_URL" \
            --dart-define "SYNCTV_PASSKEY_RP_IDS=$SYNCTV_PASSKEY_RP_IDS" \
            --build-name "${{ needs.metadata.outputs.version }}" \
            --build-number "${{ needs.metadata.outputs.build-number }}" \
            --split-debug-info build/symbols/android-all

      - name: Package Android artifacts
        run: bash tool/ci/package_release.sh android all "${{ needs.metadata.outputs.artifact-version }}" dist

      - name: Publish self-hosted Passkey configuration
        if: steps.signing.outputs.mode == 'signed'
        shell: bash
        run: |
          output="dist/SyncTV-${{ needs.metadata.outputs.artifact-version }}-android-passkey-server-config.yaml"
          cat > "$output" <<EOF
          # Public identity of this signed SyncTV Android release.
          # Merge android_apps into the webauthn section of your server configuration.
          webauthn:
            android_apps:
              - package_name: "org.synctv.app"
                sha256_cert_fingerprints:
                  - "$SYNCTV_ANDROID_CERTIFICATE_SHA256"
          EOF

      - name: Upload Android artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux:
    name: Linux ${{ matrix.architecture }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-24.04
            flutter-architecture: x64
            flutter-target: linux-x64
            rust-target: x86_64-unknown-linux-gnu
          - architecture: arm64
            runner: ubuntu-24.04-arm
            flutter-architecture: arm64
            flutter-target: linux-arm64
            rust-target: aarch64-unknown-linux-gnu

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            cmake \
            libasound2-dev \
            libepoxy-dev \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            ninja-build \
            pkg-config

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-architecture: ${{ matrix.flutter-architecture }}
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: ${{ matrix.rust-target }}

      - name: Build Linux release
        run: >-
          flutter build linux
          --release
          --target-platform "${{ matrix.flutter-target }}"
          --dart-define "SYNCTV_BUILT_IN_SERVER_URL=$SYNCTV_BUILT_IN_SERVER_URL"
          --dart-define "SYNCTV_PASSKEY_RP_IDS=$SYNCTV_PASSKEY_RP_IDS"
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build-number }}"
          --split-debug-info "build/symbols/linux-${{ matrix.architecture }}"

      - name: Strip Linux native binaries
        run: bash tool/ci/strip_linux_release.sh

      - name: Package Linux artifact
        run: bash tool/ci/package_release.sh linux "${{ matrix.architecture }}" "${{ needs.metadata.outputs.artifact-version }}" dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-linux-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows x64
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-architecture: x64
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: x86_64-pc-windows-msvc

      - name: Build Windows release
        shell: pwsh
        run: >-
          flutter build windows
          --release
          --dart-define "SYNCTV_BUILT_IN_SERVER_URL=$env:SYNCTV_BUILT_IN_SERVER_URL"
          --dart-define "SYNCTV_PASSKEY_RP_IDS=$env:SYNCTV_PASSKEY_RP_IDS"
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build-number }}"
          --split-debug-info build/symbols/windows-x64

      - name: Verify Windows binary architecture
        shell: pwsh
        run: ./tool/ci/verify_windows_architecture.ps1 -Architecture x64

      - name: Package Windows artifact
        shell: pwsh
        run: >-
          ./tool/ci/package_release.ps1
          -Version "${{ needs.metadata.outputs.artifact-version }}"
          -Architecture x64
          -OutputDirectory dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos:
    name: macOS universal
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-architecture: arm64
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Configure macOS release signing
        id: signing
        env:
          SYNCTV_APPLE_CERTIFICATE_BASE64: ${{ secrets.SYNCTV_APPLE_CERTIFICATE_BASE64 }}
          SYNCTV_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.SYNCTV_APPLE_CERTIFICATE_PASSWORD }}
          SYNCTV_APPLE_DEVELOPMENT_TEAM: ${{ vars.SYNCTV_APPLE_DEVELOPMENT_TEAM }}
          SYNCTV_APPLE_SIGNING_IDENTITY: ${{ vars.SYNCTV_MACOS_SIGNING_IDENTITY }}
          SYNCTV_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.SYNCTV_MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash tool/ci/configure_apple_signing.sh macos macos/Flutter/Signing.xcconfig

      - name: Build macOS release
        run: >-
          flutter build macos
          --release
          --dart-define "SYNCTV_BUILT_IN_SERVER_URL=$SYNCTV_BUILT_IN_SERVER_URL"
          --dart-define "SYNCTV_PASSKEY_RP_IDS=$SYNCTV_PASSKEY_RP_IDS"
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build-number }}"
          --split-debug-info build/symbols/macos-universal

      - name: Verify universal macOS binaries
        run: >-
          bash tool/ci/verify_macos_architecture.sh
          build/macos/Build/Products/Release/SyncTV.app
          universal

      - name: Create architecture-specific macOS apps
        run: bash tool/ci/create_macos_architecture_apps.sh

      - name: Verify architecture-specific macOS binaries
        run: |
          bash tool/ci/verify_macos_architecture.sh \
            build/macos/Build/Products/Release/arm64/SyncTV.app arm64
          bash tool/ci/verify_macos_architecture.sh \
            build/macos/Build/Products/Release/x64/SyncTV.app x64

      - name: Verify macOS signatures and Passkey entitlements
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          rp_ids=""
          if [[ "$SIGNING_MODE" == "signed" ]]; then
            rp_ids="$SYNCTV_PASSKEY_RP_IDS"
          fi
          for app in \
            build/macos/Build/Products/Release/SyncTV.app \
            build/macos/Build/Products/Release/arm64/SyncTV.app \
            build/macos/Build/Products/Release/x64/SyncTV.app; do
            bash tool/ci/verify_apple_entitlements.sh "$app" "$rp_ids"
          done

      - name: Notarize and staple macOS apps
        if: steps.signing.outputs.mode == 'signed'
        env:
          NOTARY_APPLE_ID: ${{ secrets.SYNCTV_APPLE_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.SYNCTV_APPLE_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ vars.SYNCTV_APPLE_NOTARY_TEAM_ID }}
        run: |
          values=("$NOTARY_APPLE_ID" "$NOTARY_PASSWORD" "$NOTARY_TEAM_ID")
          configured=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done
          if [[ "$configured" -eq 0 ]]; then
            echo "Notarization credentials are absent; publishing signed artifacts without a notarization ticket"
            exit 0
          fi
          if [[ "$configured" -ne "${#values[@]}" ]]; then
            echo "macOS notarization configuration is incomplete" >&2
            exit 1
          fi
          for app in \
            build/macos/Build/Products/Release/SyncTV.app \
            build/macos/Build/Products/Release/arm64/SyncTV.app \
            build/macos/Build/Products/Release/x64/SyncTV.app; do
            archive="$RUNNER_TEMP/$(basename "$(dirname "$app")")-SyncTV.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
            xcrun notarytool submit "$archive" \
              --apple-id "$NOTARY_APPLE_ID" \
              --password "$NOTARY_PASSWORD" \
              --team-id "$NOTARY_TEAM_ID" \
              --wait
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
          done

      - name: Package macOS artifacts
        run: |
          bash tool/ci/package_release.sh macos universal \
            "${{ needs.metadata.outputs.artifact-version }}" dist/universal
          bash tool/ci/package_release.sh macos arm64 \
            "${{ needs.metadata.outputs.artifact-version }}" dist/arm64
          bash tool/ci/package_release.sh macos x64 \
            "${{ needs.metadata.outputs.artifact-version }}" dist/x64

      - name: Upload universal macOS artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-macos-universal
          path: dist/universal/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload arm64 macOS artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-macos-arm64
          path: dist/arm64/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload x64 macOS artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-macos-x64
          path: dist/x64/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ios:
    name: iOS
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-architecture: arm64
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: aarch64-apple-ios

      - name: Configure iOS release signing
        id: signing
        env:
          SYNCTV_APPLE_CERTIFICATE_BASE64: ${{ secrets.SYNCTV_APPLE_CERTIFICATE_BASE64 }}
          SYNCTV_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.SYNCTV_APPLE_CERTIFICATE_PASSWORD }}
          SYNCTV_APPLE_DEVELOPMENT_TEAM: ${{ vars.SYNCTV_APPLE_DEVELOPMENT_TEAM }}
          SYNCTV_APPLE_SIGNING_IDENTITY: ${{ vars.SYNCTV_IOS_SIGNING_IDENTITY }}
          SYNCTV_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.SYNCTV_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash tool/ci/configure_apple_signing.sh ios ios/Flutter/Signing.xcconfig

      - name: Build iOS release
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          signing_args=()
          if [[ "$SIGNING_MODE" == "unsigned" ]]; then
            signing_args+=(--no-codesign)
          fi
          flutter build ios \
            --release \
            "${signing_args[@]}" \
            --dart-define "SYNCTV_BUILT_IN_SERVER_URL=$SYNCTV_BUILT_IN_SERVER_URL" \
            --dart-define "SYNCTV_PASSKEY_RP_IDS=$SYNCTV_PASSKEY_RP_IDS" \
            --build-name "${{ needs.metadata.outputs.version }}" \
            --build-number "${{ needs.metadata.outputs.build-number }}" \
            --split-debug-info build/symbols/ios-arm64

      - name: Verify iOS signature and Passkey entitlements
        if: steps.signing.outputs.mode == 'signed'
        run: >-
          bash tool/ci/verify_apple_entitlements.sh
          build/ios/iphoneos/Runner.app
          "$SYNCTV_PASSKEY_RP_IDS"

      - name: Package iOS artifact
        env:
          SYNCTV_IOS_SIGNED: ${{ steps.signing.outputs.mode == 'signed' && '1' || '0' }}
        run: bash tool/ci/package_release.sh ios arm64 "${{ needs.metadata.outputs.artifact-version }}" dist

      - name: Upload iOS artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-ios-${{ steps.signing.outputs.mode }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [metadata, android, linux, windows, macos, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum SyncTV-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Installation notes

          - Android filenames identify stable `signed` and ephemeral `development` signing modes.
          - Signed Android releases include a public `android-passkey-server-config.yaml` file for self-hosted servers.
          - macOS filenames identify `signed` and `ad-hoc` modes. Configured notarization credentials add and staple Apple notarization tickets.
          - iOS publishes a signed IPA when signing secrets are configured and an unsigned re-signable archive for fork builds.
          - `SHA256SUMS.txt` authenticates every attached SyncTV artifact.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            exit 0
          fi

          release_args=(
            "$RELEASE_TAG"
            dist/*
            --target "$GITHUB_SHA"
            --title "$RELEASE_TAG"
            --generate-notes
            --notes-file release-notes.md
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "${release_args[@]}"
