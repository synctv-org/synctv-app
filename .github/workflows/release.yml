name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.7"
  RUST_VERSION: "1.97.1"
  SYNCTV_BUILT_IN_SERVER_URL: ${{ vars.SYNCTV_BUILT_IN_SERVER_URL }}

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  metadata:
    name: Validate release metadata
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-number: ${{ steps.version.outputs.build-number }}
      artifact-version: ${{ steps.version.outputs.artifact-version }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read and validate pubspec version
        id: version
        shell: bash
        run: |
          raw_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          raw_version="${raw_version%$'\r'}"
          if [[ ! "$raw_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)*$ ]]; then
            echo "Invalid pubspec version: $raw_version" >&2
            exit 1
          fi

          version="${raw_version%%+*}"
          if [[ "$raw_version" == *+* ]]; then
            build_number="${raw_version##*+}"
          else
            build_number="1"
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag $GITHUB_REF_NAME must match pubspec version $version" >&2
              exit 1
            fi
          fi

          {
            echo "version=$version"
            echo "build-number=$build_number"
            echo "artifact-version=$version+$build_number"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android APKs
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Build split release APKs
        run: |
          flutter build apk \
            --release \
            --dart-define "SYNCTV_BUILT_IN_SERVER_URL=$SYNCTV_BUILT_IN_SERVER_URL" \
            --build-name "${{ needs.metadata.outputs.version }}" \
            --build-number "${{ needs.metadata.outputs.build-number }}" \
            --split-debug-info build/symbols/android-all
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define "SYNCTV_BUILT_IN_SERVER_URL=$SYNCTV_BUILT_IN_SERVER_URL" \
            --build-name "${{ needs.metadata.outputs.version }}" \
            --build-number "${{ needs.metadata.outputs.build-number }}" \
            --split-debug-info build/symbols/android-all

      - name: Package Android artifacts
        run: bash tool/ci/package_release.sh android all "${{ needs.metadata.outputs.artifact-version }}" dist

      - name: Upload Android artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux:
    name: Linux ${{ matrix.architecture }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-24.04
            flutter-architecture: x64
            flutter-target: linux-x64
            rust-target: x86_64-unknown-linux-gnu
          - architecture: arm64
            runner: ubuntu-24.04-arm
            flutter-architecture: arm64
            flutter-target: linux-arm64
            rust-target: aarch64-unknown-linux-gnu

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            cmake \
            libasound2-dev \
            libepoxy-dev \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            ninja-build \
            pkg-config

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-architecture: ${{ matrix.flutter-architecture }}
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: ${{ matrix.rust-target }}

      - name: Build Linux release
        run: >-
          flutter build linux
          --release
          --target-platform "${{ matrix.flutter-target }}"
          --dart-define "SYNCTV_BUILT_IN_SERVER_URL=$SYNCTV_BUILT_IN_SERVER_URL"
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build-number }}"
          --split-debug-info "build/symbols/linux-${{ matrix.architecture }}"

      - name: Strip Linux native binaries
        run: bash tool/ci/strip_linux_release.sh

      - name: Package Linux artifact
        run: bash tool/ci/package_release.sh linux "${{ matrix.architecture }}" "${{ needs.metadata.outputs.artifact-version }}" dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-linux-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows ${{ matrix.architecture }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
            flutter-architecture: x64
            rust-target: x86_64-pc-windows-msvc
          - architecture: arm64
            runner: windows-11-vs2026-arm
            flutter-architecture: arm64
            rust-target: aarch64-pc-windows-msvc

    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-architecture: ${{ matrix.flutter-architecture }}
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: ${{ matrix.rust-target }}

      - name: Build Windows release
        shell: pwsh
        run: >-
          flutter build windows
          --release
          --dart-define "SYNCTV_BUILT_IN_SERVER_URL=$env:SYNCTV_BUILT_IN_SERVER_URL"
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build-number }}"
          --split-debug-info "build/symbols/windows-${{ matrix.architecture }}"

      - name: Verify Windows binary architecture
        shell: pwsh
        run: ./tool/ci/verify_windows_architecture.ps1 -Architecture "${{ matrix.architecture }}"

      - name: Package Windows artifact
        shell: pwsh
        run: >-
          ./tool/ci/package_release.ps1
          -Version "${{ needs.metadata.outputs.artifact-version }}"
          -Architecture "${{ matrix.architecture }}"
          -OutputDirectory dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-windows-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos:
    name: macOS universal
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-architecture: arm64
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build macOS release
        run: >-
          flutter build macos
          --release
          --dart-define "SYNCTV_BUILT_IN_SERVER_URL=$SYNCTV_BUILT_IN_SERVER_URL"
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build-number }}"
          --split-debug-info build/symbols/macos-universal

      - name: Verify universal macOS binaries
        run: bash tool/ci/verify_macos_universal.sh

      - name: Package macOS artifact
        run: bash tool/ci/package_release.sh macos universal "${{ needs.metadata.outputs.artifact-version }}" dist

      - name: Upload macOS artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ios:
    name: iOS unsigned
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-architecture: arm64
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: aarch64-apple-ios

      - name: Build unsigned iOS release
        run: >-
          flutter build ios
          --release
          --no-codesign
          --dart-define "SYNCTV_BUILT_IN_SERVER_URL=$SYNCTV_BUILT_IN_SERVER_URL"
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build-number }}"
          --split-debug-info build/symbols/ios-arm64

      - name: Package unsigned iOS artifact
        run: bash tool/ci/package_release.sh ios arm64 "${{ needs.metadata.outputs.artifact-version }}" dist

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-ios-unsigned
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [metadata, android, linux, windows, macos, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum SyncTV-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Installation notes

          - Android APKs use the repository's current signing configuration. A fresh fork uses the development signing fallback.
          - macOS, Windows, and iOS artifacts are distributed without platform-vendor notarization or production signing.
          - The iOS archive is intended for downstream signing and device deployment workflows.
          - `SHA256SUMS.txt` authenticates every attached binary archive.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            exit 0
          fi

          release_args=(
            "$RELEASE_TAG"
            dist/*
            --target "$GITHUB_SHA"
            --title "$RELEASE_TAG"
            --generate-notes
            --notes-file release-notes.md
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "${release_args[@]}"
