name: Set up SyncTV build toolchain
description: Install pinned Flutter and Rust toolchains and restore project dependencies.

inputs:
  flutter-version:
    description: Flutter SDK version.
    required: false
    default: "3.47.2"
  flutter-revision:
    description: Immutable Flutter framework revision for source installations.
    required: false
    default: "d3b14c876900e553bc736ca19295fc09e3853e8e"
  flutter-architecture:
    description: Flutter SDK host architecture.
    required: false
    default: "x64"
  rust-version:
    description: Rust toolchain version used by the OPAQUE native asset.
    required: false
    default: "1.98.0"
  rust-targets:
    description: Optional comma-separated Rust compilation targets.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Select latest stable Xcode
      if: runner.os == 'macOS'
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Set up Flutter
      if: runner.os != 'Linux' || inputs.flutter-architecture != 'arm64'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        architecture: ${{ inputs.flutter-architecture }}
        cache: true

    - name: Cache Flutter source SDK
      if: runner.os == 'Linux' && inputs.flutter-architecture == 'arm64'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.tool_cache }}/flutter-${{ inputs.flutter-version }}-arm64
        key: flutter-source-${{ runner.os }}-arm64-${{ inputs.flutter-revision }}

    - name: Set up Flutter from source on Linux arm64
      if: runner.os == 'Linux' && inputs.flutter-architecture == 'arm64'
      shell: bash
      env:
        FLUTTER_ROOT: ${{ runner.tool_cache }}/flutter-${{ inputs.flutter-version }}-arm64
        FLUTTER_REVISION: ${{ inputs.flutter-revision }}
        FLUTTER_VERSION: ${{ inputs.flutter-version }}
      run: |
        mkdir -p "$FLUTTER_ROOT"
        if ! git -C "$FLUTTER_ROOT" rev-parse --git-dir >/dev/null 2>&1; then
          git init "$FLUTTER_ROOT"
        fi
        if git -C "$FLUTTER_ROOT" remote get-url origin >/dev/null 2>&1; then
          git -C "$FLUTTER_ROOT" remote set-url origin https://github.com/flutter/flutter.git
        else
          git -C "$FLUTTER_ROOT" remote add origin https://github.com/flutter/flutter.git
        fi
        git -C "$FLUTTER_ROOT" fetch --depth 1 origin \
          "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
        resolved_revision="$(git -C "$FLUTTER_ROOT" rev-parse "refs/tags/$FLUTTER_VERSION^{commit}")"
        if [[ "$resolved_revision" != "$FLUTTER_REVISION" ]]; then
          echo "Flutter $FLUTTER_VERSION resolved to $resolved_revision; expected $FLUTTER_REVISION" >&2
          exit 1
        fi
        git -C "$FLUTTER_ROOT" checkout --detach "refs/tags/$FLUTTER_VERSION"
        echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
        "$FLUTTER_ROOT/bin/flutter" --version

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: ${{ inputs.rust-version }}
        targets: ${{ inputs.rust-targets }}

    - name: Disable tool analytics
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: |
        flutter config --no-analytics
        dart --disable-analytics

    - name: Restore Dart dependencies
      shell: bash
      run: flutter pub get --enforce-lockfile
