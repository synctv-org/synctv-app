[package]
name = "synctv_opaque"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
opaque-ke = { version = "4.0.1", features = ["argon2", "ristretto255"] }
rand = { version = "0.8.8", features = ["getrandom"] }
sha2 = "0.10.9"

[dev-dependencies]
rand_chacha = "0.3.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
