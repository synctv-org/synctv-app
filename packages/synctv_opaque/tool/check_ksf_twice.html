<!doctype html>
<html>
<body>
<pre id="output">pending</pre>
<script>
  globalThis.dartPrint = (message) => {
    const output = document.getElementById('output');
    output.textContent = output.textContent === 'pending'
        ? message
        : output.textContent + '\n' + message;
  };
</script>
<script src="/tmp/check_ksf_twice_web.js"></script>
</body>
</html>
