name: passkeys_darwin
description: Shared Darwin implementation (iOS & macOS) of the Corbado passkeys plugin. Manages passkey creation on Apple devices.
publish_to: none
homepage: https://docs.corbado.com/overview/welcome
repository: https://github.com/corbado/flutter-passkeys/tree/main/packages/passkeys/passkeys_darwin
version: 0.4.3+3

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

flutter:
  plugin:
    implements: passkeys
    platforms:
      ios:
        pluginClass: PasskeysPlugin
        dartPluginClass: PasskeysDarwin
        sharedDarwinSource: true
      macos:
        pluginClass: PasskeysPlugin
        dartPluginClass: PasskeysDarwin
        sharedDarwinSource: true

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.18.0
  passkeys_platform_interface: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^27.3.1
  plugin_platform_interface: ^2.0.0
  very_good_analysis: ^10.3.0
